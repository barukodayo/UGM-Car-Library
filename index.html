でのラリーシーンにて活躍しており、GTIの名は40年以上残り続けることになる。\n\nその後シロッコやジェッタという派生車種にも繋がり、今日までVWを支える原初のゴルフである。","recommend":{},"raw":{"値段":"260万","車種と画像":"クラブ(BF Club)","人数":"2人","最高速等":"123km/h","積載中20kg":"","感想":"ハンドルを切った分だけ素直に\n曲がるコーナリング◎な車\n\nただパワーがないため足車の域は出れない\n\nブレーキング中の操作応答もシビア","解説":"かつてエンジンスワップと共にBティアのメタ車として君臨したクラブ\n\nその片鱗が見えるニュートラルステア(ハンドルを切った分だけ素直に\n曲がる性質)を有しており、コーナーの可能性の高さを感じる。\n\nしかし素のエンジンで勝負するしかない現状では、加速・最高速ともに\n実戦で使用できるレベルには到底及ばない。\n\nブレーキング中にハンドル操作をするとすぐ挙動が乱れるのも難点。\nただ、FF車にしてはスライド後の立て直しはしやすい。","カスタム":"","元ネタ解説":"【ベース車両】\nフォルクスワーゲン:ゴルフⅠ(17型) 1974年～1983年\n\nフォルクスワーゲンの主力車種として現在も販売が続いているゴルフシリーズの初代。\n\n横置きエンジンにFF駆動という大衆車としての理想的な形態を持ちつつ、コンパクトながら余裕の\nある室内空間で人気を博し、初代だけでも全世界で680万台以上を売り上げた超人気車種にまでなった。\n\nその中でも1975年に発表されたインジェクション装置を備えたスポーツモデル、「GTI」は当初5000台限定で販売されるはずが最終的に46万1690台を生産し、ホットハッチ人気の火付け役にもなった。\n\nレースでは特に欧州でのラリーシーンにて活躍しており、GTIの名は40年以上残り続けることになる。\n\nその後シロッコやジェッタという派生車種にも繋がり、今日までVWを支える原初のゴルフである。","初心者向け":"△","レース向け":"△","コスパ":"△"}},{"id":"コンパクト-10","category":"コンパクト","name":"ウィービル","fullName":"ウィービル(BF Weevil)★","model":"BF Weevil","image":"assets/cars/コンパクト_020_ウィービル.png","price":"260万","seats":"2人","speed":"124km/h","load":"","impression":"同カテゴリーのクラブにも劣らない\nコーナリングの良さが魅力\n\nエンジンはクラシックらしく\nパワーはないが街乗りには十分\n\nドレスアップも多めで遊び心を満たす","description":"曲線を主体としたスタイリングで街でも高い人気をもつ。\n\nパワーは物足りなさは感じるものの、コーナーは意外なほど食いつく。\n多少重さはあるが、自身の操作した分だけ素直に曲がる良挙動。\n\n同価格にコンパクトのクラブがあるが、そちらよりも安定した姿勢で\n曲がっていける良さがある。\n\nただ曲がりながら路肩などの段差に乗った時、若干イン側のタイヤが\n浮くため、場所によっては転倒の危険があるかもしれない。","custom":"","origin":"【ベース車両】\nフォルクスワーゲン:タイプ1(1938年～2003年)\n\n多少のマイナーチェンジは都度あったものの、半世紀以上も生産が続けられ、その長い歴史の中で2100万台以上という同一モデルでは市販車最多販売記録を持つ歴史的車種。\n\nこのモデルが持つ曲線美からカブト虫の英名である「ビートル」の愛称で親しまれる。\n\n1938年発売という年号からも分かる通り、戦時中に開発が行われた車種であり、当時のドイツ首相ヒトラーが打ち出した政策であるアウトバーン建設と国民車構想計画が起点になっている。\n数々の模倣疑惑や戦争による工場空襲などを乗り越え、後年のゴルフ生誕までVWを存続させ続けたドイツ車を語る上で欠かせない存在。\n\nちなみに、クラシックな見た目を持つがマニアの中では電装系やヘッドライトの仕様が変わる前の1967年より前の年式のものが需要が高く、そちらを真のヴィンテージカーとして扱っている。","recommend":{},"raw":{"値段":"260万","車種と画像":"ウィービル(BF Weevil)★","人数":"2人","最高速等":"124km/h","積載中20kg":"","感想":"同カテゴリーのクラブにも劣らない\nコーナリングの良さが魅力\n\nエンジンはクラシックらしく\nパワーはないが街乗りには十分\n\nドレスアップも多めで遊び心を満たす","解説":"曲線を主体としたスタイリングで街でも高い人気をもつ。\n\nパワーは物足りなさは感じるものの、コーナーは意外なほど食いつく。\n多少重さはあるが、自身の操作した分だけ素直に曲がる良挙動。\n\n同価格にコンパクトのクラブがあるが、そちらよりも安定した姿勢で\n曲がっていける良さがある。\n\nただ曲がりながら路肩などの段差に乗った時、若干イン側のタイヤが\n浮くため、場所によっては転倒の危険があるかもしれない。","カスタム":"","元ネタ解説":"【ベース車両】\nフォルクスワーゲン:タイプ1(1938年～2003年)\n\n多少のマイナーチェンジは都度あったものの、半世紀以上も生産が続けられ、その長い歴史の中で2100万台以上という同一モデルでは市販車最多販売記録を持つ歴史的車種。\n\nこのモデルが持つ曲線美からカブト虫の英名である「ビートル」の愛称で親しまれる。\n\n1938年発売という年号からも分かる通り、戦時中に開発が行われた車種であり、当時のドイツ首相ヒトラーが打ち出した政策であるアウトバーン建設と国民車構想計画が起点になっている。\n数々の模倣疑惑や戦争による工場空襲などを乗り越え、後年のゴルフ生誕までVWを存続させ続けたドイツ車を語る上で欠かせない存在。\n\nちなみに、クラシックな見た目を持つがマニアの中では電装系やヘッドライトの仕様が変わる前の1967年より前の年式のものが需要が高く、そちらを真のヴィンテージカーとして扱っている。","初心者向け":"△","レース向け":"△","コスパ":"△"}},{"id":"コンパクト-11","category":"コンパクト","name":"プレイリー","fullName":"プレイリー(Bollokan Prairie)","model":"Bollokan Prairie","image":"assets/cars/コンパクト_022_プレイリー.png","price":"230万","seats":"2人","speed":"131km/h","load":"","impression":"加速は多少マシなコンパクト\n\n強めなアンダーステアのため\nインに切り込んでいくのは苦手\n\nブレーキはやたら利く","description":"恐らくコンパクトカテゴリーの中で最も不人気な車種\n\n加速は同カテゴリーの中ではマシな部類だが、速度を落としてもインに\n切り込みにくい強アンダーのせいでスピードは出しにくい。\n\n交差点の旋回でも100km/hより下に落とさないとアウトに膨らんで\n危険なため、爽快感のあるドライビングはできない。\n\n引き換えにブレーキとステアリングを同時に操作しても乱れない安定性を\n持ってはいるが、結局マイナスの方が際立つ。","custom":"","origin":"【ベース車両】\nヒュンダイ:クーペ(2001年～2008年)\n\n韓国の現代自動車(現:ヒョンデ)から発売されたクーペ車。\n\n本国やアメリカではトスカーニという名前で販売されていたが、日本ではクーペという車格を表す\n単語がそのまま車名とされて販売された。\n\n日本市場では2.7L V6 DOHCエンジンを搭載した6MT/4ATの二種類が販売された。\nしかし大きいエンジンからくるフロントヘビーがアンダーステアを誘発させるため、タイトな\nコーナーが連続すると扱いずらさが目立つ。\n\nスポーツカーとしてではなく、あくまでハイウェイクルーズを楽しむための車といえる。","recommend":{},"raw":{"値段":"230万","車種と画像":"プレイリー(Bollokan Prairie)","人数":"2人","最高速等":"131km/h","積載中20kg":"","感想":"加速は多少マシなコンパクト\n\n強めなアンダーステアのため\nインに切り込んでいくのは苦手\n\nブレーキはやたら利く","解説":"恐らくコンパクトカテゴリーの中で最も不人気な車種\n\n加速は同カテゴリーの中ではマシな部類だが、速度を落としてもインに\n切り込みにくい強アンダーのせいでスピードは出しにくい。\n\n交差点の旋回でも100km/hより下に落とさないとアウトに膨らんで\n危険なため、爽快感のあるドライビングはできない。\n\n引き換えにブレーキとステアリングを同時に操作しても乱れない安定性を\n持ってはいるが、結局マイナスの方が際立つ。","カスタム":"","元ネタ解説":"【ベース車両】\nヒュンダイ:クーペ(2001年～2008年)\n\n韓国の現代自動車(現:ヒョンデ)から発売されたクーペ車。\n\n本国やアメリカではトスカーニという名前で販売されていたが、日本ではクーペという車格を表す\n単語がそのまま車名とされて販売された。\n\n日本市場では2.7L V6 DOHCエンジンを搭載した6MT/4ATの二種類が販売された。\nしかし大きいエンジンからくるフロントヘビーがアンダーステアを誘発させるため、タイトな\nコーナーが連続すると扱いずらさが目立つ。\n\nスポーツカーとしてではなく、あくまでハイウェイクルーズを楽しむための車といえる。","初心者向け":"△","レース向け":"△","コスパ":"△"}},{"id":"コンパクト-12","category":"コンパクト","name":"ラプソディ","fullName":"ラプソディ(Declasse Rhapsody)","model":"Declasse Rhapsody","image":"assets/cars/コンパクト_024_ラプソディ.png","price":"200万","seats":"2人","speed":"※170km/h","load":"","impression":"※乗りなおす度に速くなる歪みあり\n\n加速の良さが光るコンパクト\n\nコーナリングはアンダーが強いため\n早めの旋回を行うのが大事","description":"コンパクトの中ではトップクラスの加速力を持つ車。\n\nしかしハンドルを全開で切っても頭がインに切り込みにくく、\n街中の走行では不便さを感じることが多いと思われる。\n\n縦のグリップはあるため、コーナーではいっそのことスライドさせて\n早めに車の向きを変え、アクセルを踏む時間を長く取る方が速いかも。\n\nエンジンに歪みがあるため、性能は後で大幅に変わる可能性がある。","custom":"","origin":"【ベース車両】\nAMC(アメリカン・モーターズ):ペーサー前期型\n\n1970年代にGM、フォード、クライスラーのアメリカ車メーカービッグスリーとの競争と、\nオイルショックによる経営不振を打開すべくAMCから開発されたのがペーサー。\n\n10年先を見越した設計を目指して開発されたペーサーは、２ドアセダンとハッチバックを混ぜた\nようなボディに曲面ガラスを多用した斬新なデザインで女性を中心に人気を博した。\n\nエコノミーなモデルであるため当初はアメリカ車でよく使われていたV8エンジンはなく、\n3.8Lと4.2Lの直列6気筒エンジンのみラインナップが用意されていた。\n\nデビューイヤー後の販売不振からV8エンジンの追加やデザインの改変などなされたものの\n結局回復するには至らず、AMCは1979年にルノーの事実上の傘下となった。","recommend":{"beginner":"○","cost":"○"},"raw":{"値段":"200万","車種と画像":"ラプソディ(Declasse Rhapsody)","人数":"2人","最高速等":"※170km/h","積載中20kg":"","感想":"※乗りなおす度に速くなる歪みあり\n\n加速の良さが光るコンパクト\n\nコーナリングはアンダーが強いため\n早めの旋回を行うのが大事","解説":"コンパクトの中ではトップクラスの加速力を持つ車。\n\nしかしハンドルを全開で切っても頭がインに切り込みにくく、\n街中の走行では不便さを感じることが多いと思われる。\n\n縦のグリップはあるため、コーナーではいっそのことスライドさせて\n早めに車の向きを変え、アクセルを踏む時間を長く取る方が速いかも。\n\nエンジンに歪みがあるため、性能は後で大幅に変わる可能性がある。","カスタム":"","元ネタ解説":"【ベース車両】\nAMC(アメリカン・モーターズ):ペーサー前期型\n\n1970年代にGM、フォード、クライスラーのアメリカ車メーカービッグスリーとの競争と、\nオイルショックによる経営不振を打開すべくAMCから開発されたのがペーサー。\n\n10年先を見越した設計を目指して開発されたペーサーは、２ドアセダンとハッチバックを混ぜた\nようなボディに曲面ガラスを多用した斬新なデザインで女性を中心に人気を博した。\n\nエコノミーなモデルであるため当初はアメリカ車でよく使われていたV8エンジンはなく、\n3.8Lと4.2Lの直列6気筒エンジンのみラインナップが用意されていた。\n\nデビューイヤー後の販売不振からV8エンジンの追加やデザインの改変など 歪みあり\n\n見た目の割に挙動に重さがある\nコンパクトカー\n\n加速も重く、軽快なドライビング\n体験ができるとは言い難い","description":"可愛らしい見た目とは裏腹に乗り味がとても重たいブリオッソ\n\n軽量そうな印象を抱くかもしれないが、旋回・ブレーキはかなり鈍重。\n\n調子に乗ってスピードを出してしまうと、上記の特徴から大事故を\n引き起こす可能性も秘めている。\n\nあの有名な怪盗が使用してる車に似てるのもあってデザイン面で人気が\nあるため、誕生日プレゼントなどの贈り物に適している。","custom":"","origin":"【ベース車両】\nフィアット:ヌオーヴァ 500(チンクエチェント) 1957年～1975年\n\n当時イタリアで自動車を買えない大衆の間に流行していたスクーターからの乗り換えを狙うべく、小型で安価ながらも四人乗りできる車として開発されたミニマムカー。\n\n空冷直列2気筒エンジンをRR方式にて採用することで車内スペースを確保。軽量が幸いして18馬力程度ながら最高速は90km/hほどまで伸ばせたが、騒音や振動の大きさなど欠点も存在している。\n\n500に限った話ではないが、丸みを帯びたボディ形状はプレス加工時にて軽量化と高剛性を両立しており、デザイン性と実用性を兼ね備える。\n\nこうして小型・実用性・安価を備えた500はイタリアを中心に人気を集め、今日に至るまでその系譜を引き継ぐ車が存在し続けることになった。","recommend":{"beginner":"○"},"raw":{"値段":"230万","車種と画像":"ブリオッソ(Grotti Brioso 300)★","人数":"2人","最高速等":"※140km/h","積載中20kg":"","感想":"※乗りなおす度に速くなる歪みあり\n\n見た目の割に挙動に重さがある\nコンパクトカー\n\n加速も重く、軽快なドライビング\n体験ができるとは言い難い","解説":"可愛らしい見た目とは裏腹に乗り味がとても重たいブリオッソ\n\n軽量そうな印象を抱くかもしれないが、旋回・ブレーキはかなり鈍重。\n\n調子に乗ってスピードを出してしまうと、上記の特徴から大事故を\n引き起こす可能性も秘めている。\n\nあの有名な怪盗が使用してる車に似てるのもあってデザイン面で人気が\nあるため、誕生日プレゼントなどの贈り物に適している。","カスタム":"","元ネタ解説":"【ベース車両】\nフィアット:ヌオーヴァ 500(チンクエチェント) 1957年～1975年\n\n当時イタリアで自動車を買えない大衆の間に流行していたスクーターからの乗り換えを狙うべく、小型で安価ながらも四人乗りできる車として開発されたミニマムカー。\n\n空冷直列2気筒エンジンをRR方式にて採用することで車内スペースを確保。軽量が幸いして18馬力程度ながら最高速は90km/hほどまで伸ばせたが、騒音や振動の大きさなど欠点も存在している。\n\n500に限った話ではないが、丸みを帯びたボディ形状はプレス加工時にて軽量化と高剛性を両立しており、デザイン性と実用性を兼ね備える。\n\nこうして小型・実用性・安価を備えた500はイタリアを中心に人気を集め、今日に至るまでその系譜を引き継ぐ車が存在し続けることになった。","初心者向け":"○","レース向け":"△","コスパ":"△"}},{"id":"コンパクト-15","category":"コンパクト","name":"ブリオッソﾜｲﾄﾞﾎﾞﾃﾞｨ","fullName":"ブリオッソﾜｲﾄﾞﾎﾞﾃﾞｨ(Grotti Brioso 300 Widebody)","model":"Grotti Brioso 300 Widebody","image":"assets/cars/コンパクト_030_ブリオッソﾜｲﾄﾞﾎﾞﾃﾞｨ.png","price":"450万","seats":"2人","speed":"132km/h","load":"","impression":"ブリオッソのワイドフェンダーver\n\nノーマルブリオッソ以下の加速力\n\nハンドルを曲げてるだけで勝手に\nスライドするほどグリップがない\n\n使いづらさトップクラス","description":"ブリオッソをワイドフェンダー化させてよりスポーティな見た目に。\n\nしかしその実態はノーマル版を下回る扱いづらさを持つほどに不便。\n\n加速が素早くない車が多いコンパクトカテゴリーの中でも特に遅く、\n旋回・ブレーキも取り回しがかなり悪い。\n\nドレスアップパーツは豊富なのでいじる楽しさはあるが、\nどう足掻いても const TABS=["コンパクト","クーペ","OFF-RORD","EV","セダン","スポーツ","SUV","バイク"];let currentCategory="";let showFavoritesOnly=false;let favorites=JSON.parse(localStorage.getItem("ugm_car_favorites_v1_filled")||"[]");function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}function norm(v){return String(v||"").toLowerCase().replace(/\s+/g,"");}function num(v){const n=Number(String(v||"").replace(/[^0-9.]/g,""));return Number.isFinite(n)?n:0;}function fav(id){return favorites.includes(id);}const REC_META={beginner:{label:"初心者向け",detail:"🌱 初心者向け",icon:"🌱",cls:"beginner"},race:{label:"レース向け",detail:"🏁 レース向け",icon:"🏁",cls:"race"},cost:{label:"コスパ",detail:"💰 コスパ",icon:"💰",cls:"cost"}};function recList(c){const r=c.recommend||{};return Object.keys(REC_META).filter(k=>r[k]==="◎"||r[k]==="○").map(k=>({key:k,value:r[k],...REC_META[k]}));}function hasRecommend(c){return recList(c).length>0;}function recMarks(c){const list=recList(c);return list.length?`<div class="rec-badges" aria-label="おすすめ評価">${list.map(x=>`<div class="rec-badge ${x.cls} ${x.value==="○"?"normal":""}" title="${x.label}：${x.value}">${x.icon}</div>`).join("")}</div>`:"";}function recDetail(c){const list=recList(c);return list.length?`<div class="detail-rating-panel"><div class="detail-rating-title">✨ おすすめ評価</div><div class="detail-badge-row">${list.map(x=>`<div class="detail-rec-badge ${x.cls} ${x.value==="○"?"normal":""}"><span class="rec-label"><span>${x.icon}</span>${x.label}<span class="rec-note">${x.value==="◎"?"とてもおすすめ":"おすすめ"}</span></span><span class="rec-value">${x.value}</span></div>`).join("")}</div></div>`:"";}function saveFav(){localStorage.setItem("ugm_car_favorites_v1_filled",JSON.stringify(favorites));}function toggleFav(id,e){e.stopPropagation();const btn=e.currentTarget;favorites=fav(id)?favorites.filter(x=>x!==id):[...favorites,id];saveFav();btn.classList.add("spark");setTimeout(()=>render(),180);}function img(src,cls){return src?`<div class="${cls}"><img src="${esc(src)}" onerror="this.parentElement.textContent='画像準備中'"></div>`:`<div class="${cls}">画像準備中</div>`;}function softRender(){const g=document.getElementById("grid");if(g){g.classList.add("switching");setTimeout(()=>{render();requestAnimationFrame(()=>g.classList.remove("switching"));},110);}else{render();}}function setCategory(cat){currentCategory=cat;showFavoritesOnly=false;document.getElementById("favToggle").textContent="☆ お気に入り";softRender();}function buildCategories(){const counts={};CAR_DATA.forEach(c=>counts[c.category]=(counts[c.category]||0)+1);document.getElementById("categoryList").innerHTML=`<button class="cat-btn ${currentCategory===""?"active":""}" onclick="setCategory('')"><span>▦ すべて</span><span class="pill">${CAR_DATA.length}</span></button>`+TABS.map(t=>`<button class="cat-btn ${currentCategory===t?"active":""}" onclick="setCategory('${t}')"><span>🚙 ${t}</span><span class="pill">${counts[t]||0}</span></button>`).join("");}function filtered(){const q=norm(document.getElementById("searchInput").value);const sort=document.getElementById("sortSelect").value;let list=CAR_DATA.filter(c=>(!currentCategory||c.category===currentCategory)&&(!showFavoritesOnly||fav(c.id))&&(!q||norm([c.name,c.fullName,c.model,c.impression,c.description].join(" ")).includes(q)));if(sort==="nameAsc")list.sort((a,b)=>a.name.localeCompare(b.name,"ja"));if(sort==="priceAsc")list.sort((a,b)=>num(a.price)-num(b.price));if(sort==="priceDesc")list.sort((a,b)=>num(b.price)-num(a.price));if(sort==="speedDesc")list.sort((a,b)=>num(b.speed)-num(a.speed));if(sort==="seatsDesc")list.sort((a,b)=>num(b.seats)-num(a.seats));const recScore=(c,key)=>c.recommend?.[key]==="◎"?2:c.recommend?.[key]==="○"?1:0;if(sort==="beginnerRecommend")list.sort((a,b)=>recScore(b,"beginner")-recScore(a,"beginner")||a.name.localeCompare(b.name,"ja"));if(sort==="costRecommend")list.sort((a,b)=>recScore(b,"cost")-recScore(a,"cost")||a.name.localeCompare(b.name,"ja"));if(sort==="raceRecommend")list.sort((a,b)=>recScore(b,"race")-recScore(a,"race")||a.name.localeCompare(b.name,"ja"));return list;}function render(){buildCategories();const list=filtered();const title=showFavoritesOnly?"お気に入り":(currentCategory||"すべての車両");document.getElementById("panelTitle").textContent=`${title} (${list.length}台)`;document.getElementById("status").textContent=`全${CAR_DATA.length}台 / 表示${list.length}台`;document.getElementById("grid").innerHTML=list.length?list.map(c=>`<article class="card ${hasRecommend(c)?"recommended":""}" onclick="showDetail('${esc(c.id)}')"><button class="star ${fav(c.id)?"active":""}" onclick="toggleFav('${esc(c.id)}',event)">${fav(c.id)?"★":"☆"}</button>${recMarks(c)}${img(c.image,"thumb")}<div class="body"><h3 class="name">${esc(c.name)}</h3><div class="badge">${esc(c.category)}</div><div class="price">${esc(c.price||"-")}</div><div class="spec"><span>最高速</span><strong>${esc(c.speed||"-")}</strong></div><div class="spec"><span>乗車人数</span><strong>${esc(c.seats||"-")}</strong></div><div class="spec"><span>積載</span><strong>${esc(c.load||"-")}</strong></div></div></article>`).join(""):`<div class="empty">該当する車両がありません。</div>`;}function showDetail(id){const c=CAR_DATA.find(x=>x.id===id);if(!c)return;document.getElementById("modalContent").innerHTML=`<h2 class="detail-title">${esc(c.name)}</h2>${recDetail(c)}<div class="detail-grid"><div>${img(c.image,"detail-img")}</div><div><table><tr><th>カテゴリ</th><td>${esc(c.category)}</td></tr><tr><th>正式名</th><td>${esc(c.fullName||"-")}</td></tr><tr><th>モデル名</th><td>${esc(c.model||"-")}</td></tr><tr><th>価格</th><td>${esc(c.price||"-")}</td></tr><tr><th>最高速</th><td>${esc(c.speed||"-")}</td></tr><tr><th>乗車人数</th><td>${esc(c.seats||"-")}</td></tr><tr><th>積載</th><td>${esc(c.load||"-")}</td></tr></table>${c.impression?`<div class="text-box"><h3>感想</h3>${esc(c.impression)}</div>`:""}${c.description?`<div class="text-box"><h3>解説</h3>${esc(c.description)}</div>`:""}${c.custom?`<div class="text-box"><h3>カスタム</h3>${esc(c.custom)}</div>`:""}${c.origin?`<div class="text-box"><h3>元ネタ解説</h3>${esc(c.origin)}</div>`:""}</div></div>`;document.getElementById("modalWrap").classList.add("open");}function hideDetail(){document.getElementById("modalWrap").classList.remove("open");}document.getElementById("searchInput").addEventListener("input",softRender);document.getElementById("sortSelect").addEventListener("change",softRender);document.getElementById("favToggle").addEventListener("click",()=>{showFavoritesOnly=!showFavoritesOnly;currentCategory="";document.getElementById("favToggle").textContent=showFavoritesOnly?"★ 全車両に戻る":"☆ お気に入り";softRender();});render();window.addEventListener("load",()=>setTimeout(()=>document.getElementById("loader")?.classList.add("hide"),450));</script></body></html>
